name: Remote Deployment Sync

on:
  push:
    branches:
      - main

jobs:
  deploy-to-servers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.248.52
          username: ronh
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd /opt/your/Trading_Bot_V2
            git fetch origin main
            git reset --hard origin/main

      - name: Deploy to Home PC
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOME_PC_IP }}
          username: Linda
          key: ${{ secrets.HOME_PC_SSH_KEY }}
          script: |
            cd C:\Users\Linda\trading_bot_v2
            git fetch origin main
            git reset --hard origin/main
