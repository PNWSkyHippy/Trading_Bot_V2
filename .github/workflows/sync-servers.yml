name: Remote Deployment Sync
permissions:
  contents: read
  pull-requests: write


on:
  push:
    branches:
      - main

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger Server (Native SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.248.52
          username: ronh
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          script: |
            cd /opt/trading_bot_v2
            git fetch origin main
            git reset --hard origin/main
