name: Remote Deployment Sync

on:
  push:
    branches:
      - main

jobs:
  deploy-to-servers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger Server (Native SSH)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 187.127.248.52 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 ronh@187.127.248.52 << 'INNER_EOF'
            cd /opt/trading_bot_v2
            git fetch origin main
            git reset --hard origin/main
          INNER_EOF

      - name: Deploy to Home PC (Native SSH)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOME_PC_SSH_KEY }}" > ~/.ssh/home_id
          chmod 600 ~/.ssh/home_id
          ssh-keyscan -p 22 -H ${{ secrets.HOME_PC_IP }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/home_id -p 22 Linda@${{ secrets.HOME_PC_IP }} << 'INNER_EOF'
            cd C:\Users\Linda\trading_bot_v2
            git fetch origin main
            git reset --hard origin/main
          INNER_EOF
