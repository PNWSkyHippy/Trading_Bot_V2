name: Update Graphify Map

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"  # Don't re-run if only graphify changes
  workflow_dispatch:  # Manual trigger

jobs:
  rebuild-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: python -m pip install graphifyy==0.9.32

      - name: Update Graphify Map
        run: graphify update .
      
      - name: Commit and Push
        run: |
          git config user.name "Codex Bot"
          git config user.email "codex@bot"
          git add graphify-out/
          git commit -m "🔄 Update graphify map" || true
          git push
