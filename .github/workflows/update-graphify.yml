name: Update Graphify Map

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"  # Don't re-run if only graphify changes
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

concurrency:
  group: graphify-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: python -m pip install graphifyy==0.9.32

      - name: Update Graphify Map
        run: graphify update .
      
      - name: Commit updated Graphify Map
        run: |
          git config user.name "Graphify Bot"
          git config user.email "graphify@bot"
          git add -A -- graphify-out/
          if git diff --cached --quiet; then
            echo "Graphify map is already current."
            exit 0
          fi
          git commit -m "Update Graphify map"
          git push origin HEAD:main
