name: Update Graphify Map

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"  # Don't re-run if only graphify changes
  workflow_dispatch:  # Manual trigger

jobs:
  rebuild-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: python -m pip install graphifyy==0.9.32

      - name: Update Graphify Map
        run: graphify update .
      
      - name: Upload Graphify Map
        uses: actions/upload-artifact@v4
        with:
          name: graphify-map-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          retention-days: 7
