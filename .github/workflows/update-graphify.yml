name: Update Graphify Map

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"  # Don't re-run if only graphify changes
  workflow_dispatch:  # Manual trigger

jobs:
  rebuild-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Codex CLI
        run: npm install -g @openai/codex  # Codex CLI package
      
      - name: Rebuild Graphify Map
        run: codex exec "graphify build --project-root ."
      
      - name: Commit and Push
        run: |
          git config user.name "Codex Bot"
          git config user.email "codex@bot"
          git add graphify-out/
          git commit -m "🔄 Update graphify map" || true
          git push
