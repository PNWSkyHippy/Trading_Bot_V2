==============================================================================
; POV-Ray Animation & Render INI Profile for Tunnel
; ==============================================================================
Input_File_Name = "tunnel.pov"
Output_File_Type = N                ; Output format: PNG ('N' = PNG, 'J' = JPEG)
Output_File_Name = "frames/tunnel_"
Quality = 9
; 1080p Resolution & Anti-Aliasing
Width = 1920
Height = 1080
Antialias = On
Antialias_Threshold = 0.3
Antialias_Depth = 3
; ------------------------------------------------------------------------------
; ANIMATION SETTINGS:
; Moving the camera continuously down the 500-yard tunnel.
; 300 frames at 30 fps = 10 seconds of smooth forward travel.
; (Adjust Final_Frame to change total number of frames)
; ------------------------------------------------------------------------------
Initial_Frame = 1
Final_Frame = 300
Initial_Clock = 0.0
Final_Clock = 0.98
Cyclic_Animation = Off