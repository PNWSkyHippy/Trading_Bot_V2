{name: archon-architect,description: "Use when: User wants an architectural sweep, complexity reduction, or codebase health improvement.\nTriggers: \"architect\", \"simplify codebase\", \"reduce complexity\", \"architectural sweep\",\n          \"clean up architecture\", \"codebase health\", \"fix architecture\".\nDoes: Scans codebase metrics -> analyzes architecture with principled lens -> plans targeted\n      simplifications -> executes fixes with self-review loops (hooks) -> validates -> creates PR.\nNOT for: Single-file fixes, feature development, bug fixes, PR reviews.\n\nDAG workflow showcasing per-node hooks:\n- PostToolUse hooks create organic quality loops (lint after write, self-review)\n- PreToolUse hooks inject architectural principles before changes\n- Different nodes have different trust levels and steering\n",provider: claude,model: sonnet,nodes: [{id: scan-metrics,bash: "echo \"=== FILE SIZE HOTSPOTS (top 30 largest source files) ===\"\nfind . -name '*.ts' -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/dist/*' \\\n  -exec wc -l {} + 2>/dev/null | sort -rn | head -30\n\necho \"\"\necho \"=== IMPORT FAN-OUT (files with most imports) ===\"\nfor f in $(find . -name '*.ts' -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/dist/*'); do\n  count=$(grep -c \"^import \" \"$f\" 2>/dev/null) || count=0\n  if [ \"$count\" -gt 8 ]; then\n    echo \"$count imports: $f\"\n  fi\ndone | sort -rn | head -20\n\necho \"\"\necho \"=== EXPORT FAN-OUT (files with most exports) ===\"\nfor f in $(find . -name '*.ts' -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/dist/*'); do\n  count=$(grep -c \"^export \" \"$f\" 2>/dev/null) || count=0\n  if [ \"$count\" -gt 5 ]; then\n    echo \"$count exports: $f\"\n  fi\ndone | sort -rn | head -20\n\necho \"\"\necho \"=== FUNCTION LENGTH HOTSPOTS (functions over 50 lines) ===\"\ngrep -rn \"^\\(export \\)\\?\\(async \\)\\?function \\|=> {$\" \\\n  --include='*.ts' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . 2>/dev/null \\\n  | head -30\n\necho \"\"\necho \"=== TYPE SAFETY GAPS ===\"\necho \"any usage:\"\ngrep -rn \": any\\b\\|as any\\b\" --include='*.ts' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . 2>/dev/null | wc -l\necho \"eslint-disable comments:\"\ngrep -rn \"eslint-disable\" --include='*.ts' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . 2>/dev/null | wc -l",timeout: 60000},{id: analyze,depends_on: [scan-metrics],context: fresh,denied_tools: [Write,Edit,Bash],hooks: {PostToolUse: [{matcher: Read,response: {hookSpecificOutput: {hookEventName: PostToolUse,additionalContext: "For the file you just read, assess: (1) Single responsibility — does this module do exactly one thing? (2) Cognitive load — could a new team member understand this in 5 minutes? (3) Abstraction value — does every abstraction earn its complexity, or is it premature? (4) Dependency direction — does this file depend on things at its own level or below, not above? Add any concerns to your running list. Be specific — cite line ranges and function names.\n"}}}]},prompt: "You are a senior software architect performing a codebase health assessment.\n\n## Codebase Metrics\n\n$scan-metrics.output\n\n## User Focus\n\n$ARGUMENTS\n\n## Instructions\n\n1. Read the top 10-15 files flagged by the metrics above (largest, most imports, most exports)\n2. For each file, assess the criteria injected after you read it (you'll see them)\n3. Build a running list of architectural concerns\n4. Focus on:\n   - Modules doing too many things (SRP violations)\n   - Abstractions that don't earn their complexity\n   - Duplicated patterns that should be consolidated (Rule of Three)\n   - God files or god functions\n   - Leaky abstractions or tight coupling between layers\n   - Dead code or unused exports\n5. Do NOT suggest changes yet — only diagnose\n\n## Output\n\nWrite a structured assessment to $ARTIFACTS_DIR/architecture-assessment.md with:\n- Executive summary (3-5 sentences)\n- Top findings ranked by impact\n- For each finding: file, what's wrong, why it matters, estimated effort"},{id: plan,depends_on: [analyze],context: fresh,allowed_tools: [Read],prompt: "You are planning targeted architectural improvements.\n\n## Assessment\n\n$analyze.output\n\n## Principles\n\n- KISS: prefer straightforward over clever\n- YAGNI: remove speculative abstractions\n- Rule of Three: only extract when a pattern appears 3+ times\n- Each change must be independently revertable\n- Do NOT mix refactoring with behavior changes\n- Scope to what can be done safely in one pass (max 5-7 files)\n\n## Instructions\n\n1. From the assessment, select the top 3-5 highest-impact, lowest-risk improvements\n2. For each, write a precise plan: which file, what to change, why\n3. Order them so each change is independent (no cascading dependencies between changes)\n4. Estimate blast radius — how many other files are affected\n\n## Output\n\nWrite the plan as a numbered list. Be specific about exactly what code to change.\nKeep it concise — the implement node will follow this literally."},{id: simplify,depends_on: [plan],context: fresh,hooks: {PreToolUse: [{matcher: Write|Edit,response: {hookSpecificOutput: {hookEventName: PreToolUse,additionalContext: "Before writing: Is this file in your plan? If not, explain why you're touching it. Check how many files import from this module — changes to widely-imported modules need extra scrutiny.\n"}}}],PostToolUse: [{matcher: Write|Edit,response: {systemMessage: "You just modified a file. Do these things NOW before moving on: 1. Run the type checker to verify your change compiles 2. Re-read the file you changed — is it ACTUALLY simpler, or did you just move complexity around? 3. State in ONE sentence why this change reduces complexity. If you cannot justify it, revert it.\n"}},{matcher: Read,response: {hookSpecificOutput: {hookEventName: PostToolUse,additionalContext: "Before modifying this file, consider: will your change reduce or increase the number of concepts a reader needs to hold in their head?\n"}}},{matcher: Bash,response: {hookSpecificOutput: {hookEventName: PostToolUse,additionalContext: "Check the exit code. If the command failed, diagnose the root cause before attempting a fix. Do not blindly retry.\n"}}}]},prompt: "You are implementing targeted architectural simplifications.\n\n## Plan\n\n$plan.output\n\n## Rules\n\n- Follow the plan exactly — do not add extra improvements you notice along the way\n- Each change must preserve existing behavior (refactor only, no feature changes)\n- After each file edit, you'll be prompted to validate — follow those instructions\n- If a change turns out to be harder than expected, skip it and move on\n- Commit each logical change separately with a clear commit message\n\n## Instructions\n\n1. Work through the plan items in order\n2. For each item: read the file, make the change, follow the post-edit checklist\n3. After all changes, do a final `git diff --stat` to verify scope"},{id: validate,depends_on: [simplify],bash: "echo \"=== TYPE CHECK ===\"\nbun run type-check 2>&1\nTC_EXIT=$?\n\necho \"\"\necho \"=== LINT ===\"\nbun run lint 2>&1\nLINT_EXIT=$?\n\necho \"\"\necho \"=== TESTS ===\"\nbun run test 2>&1\nTEST_EXIT=$?\n\necho \"\"\necho \"=== RESULTS ===\"\necho \"Type check: $([ $TC_EXIT -eq 0 ] && echo 'PASS' || echo 'FAIL')\"\necho \"Lint: $([ $LINT_EXIT -eq 0 ] && echo 'PASS' || echo 'FAIL')\"\necho \"Tests: $([ $TEST_EXIT -eq 0 ] && echo 'PASS' || echo 'FAIL')\"\n\n# Always exit 0 so downstream nodes can read output and decide\nif [ $TC_EXIT -eq 0 ] && [ $LINT_EXIT -eq 0 ] && [ $TEST_EXIT -eq 0 ]; then\n  echo \"VALIDATION_STATUS: PASS\"\nelse\n  echo \"VALIDATION_STATUS: FAIL\"\nfi",timeout: 300000},{id: fix-failures,depends_on: [validate],context: fresh,hooks: {PreToolUse: [{matcher: Write|Edit,response: {hookSpecificOutput: {hookEventName: PreToolUse,additionalContext: "You are fixing validation failures only. Do not make any changes beyond what's needed to pass the failing checks. If in doubt, revert the original change that caused the failure.\n"}}}],PostToolUse: [{matcher: Write|Edit,response: {systemMessage: "You just made a fix. Run the specific failing validation check NOW to verify your fix works. Do not batch fixes — verify each one.\n"}}]},prompt: "Review the validation output below.\n\n## Validation Output\n\n$validate.output\n\n## Instructions\n\nIf the output ends with \"VALIDATION_STATUS: PASS\", respond with\n\"All checks passed — no fixes needed.\" and stop.\n\nIf there are failures:\n\n1. Read the validation failures carefully\n2. Fix ONLY what's broken — do not make additional improvements\n3. If a fix requires changing behavior (not just fixing a type/lint error),\n   revert the original change instead\n4. Run the specific failing check after each fix to confirm it passes\n5. After all fixes, run the full validation suite: `bun run validate`"},{id: create-pr,depends_on: [fix-failures],context: fresh,hooks: {PreToolUse: [{matcher: Write|Edit,response: {hookSpecificOutput: {hookEventName: PreToolUse,permissionDecision: deny,permissionDecisionReason: PR creation node — do not modify source files. Use only git and gh commands.}}}],PostToolUse: [{matcher: Bash,response: {hookSpecificOutput: {hookEventName: PostToolUse,additionalContext: "Verify this command succeeded. If git push or gh pr create failed, read the error message carefully before retrying.\n"}}}]},prompt: "Create a pull request for the architectural improvements.\n\n## Context\n\n- Architecture assessment: $analyze.output\n- Plan: $plan.output\n- Validation: $validate.output\n\n## Instructions\n\n1. Stage all changes and create a single commit (or verify existing commits)\n2. Push the branch: `git push -u origin HEAD`\n3. Check if a PR already exists: `gh pr list --head $(git branch --show-current)`\n4. Create the PR targeting `$BASE_BRANCH` as the base branch:\n   `gh pr create --base $BASE_BRANCH --title \"...\" --body \"...\"`\n   - Title: concise description of what was simplified (under 70 chars)\n   - Body: use the format below\n5. Save the PR URL to `$ARTIFACTS_DIR/.pr-url`\n\n## PR Body Format\n\n```markdown\n## Architectural Sweep\n\n**Focus**: $ARGUMENTS\n\n### Assessment\n\n[3-5 sentence summary from the architecture assessment]\n\n### Changes\n\n[For each change: what file, what was simplified, why]\n\n### Validation\n\n- [x] Type check passes\n- [x] Lint passes\n- [x] Tests pass\n- [x] Each change preserves existing behavior\n```"},{id: verify-pr-base,depends_on: [create-pr],bash: "set -euo pipefail\nEXPECTED=\"$BASE_BRANCH\"\nACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')\nif [ \"$ACTUAL\" != \"$EXPECTED\" ]; then\n  PR_NUMBER=$(gh pr view --json number -q '.number')\n  echo \"Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting\" >&2\n  gh pr edit \"$PR_NUMBER\" --base \"$EXPECTED\"\nelse\n  echo \"PR base verified: $EXPECTED\"\nfi"}]}