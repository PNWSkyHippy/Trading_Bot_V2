{name: breakout-pipeline-plan,description: "Analyzes the BreakoutScanner.py → breakout_sender.py → core/breakout_receiver.py\nsignal pipeline and writes a 4-part implementation plan:\n  1. Sub-minute signal delivery (scanner detects → receiver gets within 60s)\n  2. Complete enrichment payload (all fields receiver checks, fully populated)\n  3. Direction flip logic (Long → Short when breakout reverses mid-flight)\n  4. Re-entry after profitable close (scan → send → receive immediately on win)\nOutput: $ARTIFACTS_DIR/breakout_pipeline_plan.md\nRun from: C:\\users\\linda\\trading_bot_v2\n",provider: claude,model: sonnet,nodes: [{id: scan-timing-constants,bash: "echo \"=== File line counts ===\"\nwc -l BreakoutScanner.py breakout_sender.py core/breakout_receiver.py breakout_filter.py 2>/dev/null || true\n\necho \"\"\necho \"=== Receiver timing / threshold constants ===\"\ngrep -n \"SIGNAL_TTL_SEC\\|PRICE_DRIFT_MAX_PCT\\|VOLUME_SPIKE_MIN\\|MIN_SOFT_PASSES\\|WICK_BODY_MAX\\|GAP_TRAP_MAX\\|STOP_MAX_DISTANCE\\|RSI_\" core/breakout_receiver.py | head -30\n\necho \"\"\necho \"=== Scanner timing constants ===\"\ngrep -n \"scan_interval_seconds\\|ALERT_COOLDOWN_SECS\" BreakoutScanner.py | head -10\n\necho \"\"\necho \"=== Sender dedup / retry constants ===\"\ngrep -n \"_dedup_sec\\|MAX_RETRIES\\|SEND_TIMEOUT_SEC\\|RETRY_DELAY_SEC\\|DEFAULT_MIN_ESCALATION\" breakout_sender.py | head -10\n\necho \"\"\necho \"=== Receiver REQUIRED_FIELDS ===\"\ngrep -n \"REQUIRED_FIELDS\" core/breakout_receiver.py\n\necho \"\"\necho \"=== Signal timestamp assignment in scanner ===\"\ngrep -n \"timestamp.*datetime\\|signal\\.timestamp\\|BreakoutSignal(\" BreakoutScanner.py | head -20\n\necho \"\"\necho \"=== Where send_alert is called (who triggers the send) ===\"\ngrep -n \"send_alert\\|bot_sender\\.\" BreakoutScanner.py | head -20",timeout: 20000},{id: scan-enrichment-gaps,bash: "echo \"=== BreakoutSignal dataclass — every field ===\"\ngrep -n \"^\\s\\+[a-z_]\\+:\" BreakoutScanner.py | head -30\n# Also get the dataclass block\npython -c \"\nimport re, sys\nsrc = open('BreakoutScanner.py').read()\nm = re.search(r'class BreakoutSignal.*?(?=\\n@dataclass|\\nclass |\\ndef |\\Z)', src, re.S)\nif m: print(m.group())\n\" 2>/dev/null || grep -A 30 \"class BreakoutSignal\" BreakoutScanner.py | head -35\n\necho \"\"\necho \"=== _build_enrichment output keys ===\"\ngrep -n \"_build_enrichment\\|data\\[.\\|enrichment\\[.\" BreakoutScanner.py | head -40\n\necho \"\"\necho \"=== Sender _build_payload — every field it sends ===\"\ngrep -n '\"[a-z_]\\+\"' breakout_sender.py | grep \"return\\|\\\":\" | head -50\n\necho \"\"\necho \"=== Receiver: every p.get() field read ===\"\ngrep -n 'p\\.get(\\|p\\[\"' core/breakout_receiver.py | head -60\n\necho \"\"\necho \"=== EscalationTracker — does it track bars_since_breakout? ===\"\ngrep -n \"bars_since\\|breakout_level\\|distance_from\\|structural_stop\\|_tracked\" BreakoutScanner.py | head -20\n\necho \"\"\necho \"=== Sender: breakout metadata fields ===\"\ngrep -n \"bars_since_breakout\\|breakout_level\\|distance_from_breakout\" breakout_sender.py",timeout: 20000},{id: scan-position-monitor,bash: "echo \"=== Position monitor / trade close hooks ===\"\nfor f in core/position_monitor.py core/risk_manager.py core/trade_executor.py; do\n  if [ -f \"$f\" ]; then\n    echo \"\"\n    echo \"--- $f ---\"\n    grep -n \"closed\\|won\\|profit\\|cooldown\\|_last_closed\\|callback\\|on_close\\|close_trade\" \"$f\" | head -30\n  fi\ndone\n\necho \"\"\necho \"=== bot_engine.py — scanner wiring ===\"\ngrep -n \"scanner\\|breakout_receiver\\|set_scanner\\|set_executor\" bot_engine.py 2>/dev/null | head -30\n\necho \"\"\necho \"=== risk_manager _last_closed structure ===\"\ngrep -n \"_last_closed\\|won\\|cooldown\" core/risk_manager.py 2>/dev/null | head -20",timeout: 20000},{id: analyze-timing,depends_on: [scan-timing-constants],context: fresh,allowed_tools: [Read,Grep,Bash],prompt: "You are a senior trading systems engineer analyzing a signal timing gap.\n\n## File stats and constants\n$scan-timing-constants.output\n\nRead BreakoutScanner.py, breakout_sender.py, and core/breakout_receiver.py now.\n\nFocus on the exact path from breakout detection to receiver acceptance:\n\n1. **Detection**: When does BreakoutDetector.detect_breakout() or WatchlistManager.check() fire?\n   What sets BreakoutSignal.timestamp — is it the detection moment or the alert moment?\n\n2. **Watchlist delay**: A symbol goes to WATCHLIST first, ALERTED only on next scan cycle.\n   With scan_interval_seconds=30, what's the minimum delay between detection and send?\n\n3. **Dedup gate**: BreakoutSender._dedup_sec=30 and _last_sent[symbol].\n   Does _last_sent block the VERY FIRST send for a new symbol? (It shouldn't — check the logic.)\n   What about escalation re-sends (esc=1,2,3) — are they blocked by dedup?\n\n4. **TTL calculation**: receiver._signal_age() computes age from payload[\"timestamp\"].\n   If that timestamp is set at detection (T=0) and arrives at T=45s → age=45s → passes 60s TTL.\n   If timestamp is set at send time (T=30s) and arrives at T=31s → age=1s → passes.\n   But if timestamp is the DETECTION time and delivery takes >60s → fails.\n   Find the worst case.\n\n5. **Escalation re-sends**: On esc=1/2/3, is the signal re-built with current data?\n   Does current_price get refreshed, or does it use the stale entry_price?\n\nProduce a concrete timing analysis with:\n- The exact worst-case timeline (annotate each step with seconds elapsed)\n- Whether the first send can exceed 60s TTL under current code\n- A numbered list of specific code changes to guarantee <60s delivery:\n  * Where to set timestamp (detection moment vs send moment)\n  * Whether to reduce scan_interval for escalation-only re-checks\n  * Whether to add a `force_send=True` flag that bypasses _dedup_sec for escalation sends\n  * Whether EscalationTracker.check() should immediately trigger a send on first promotion"},{id: analyze-enrichment,depends_on: [scan-enrichment-gaps],context: fresh,allowed_tools: [Read,Grep,Bash],prompt: "You are mapping every field the breakout_receiver reads vs what the scanner currently provides.\n\n## Field constants and grep output\n$scan-enrichment-gaps.output\n\nRead core/breakout_receiver.py (all _check_* methods and _inject_signal), BreakoutScanner.py\n(BreakoutSignal dataclass, _build_enrichment, EscalationTracker), and breakout_sender.py\n(_build_payload).\n\nBuild a complete field inventory table:\n\n| Field name | Receiver check | Hard/Soft/Required | Scanner source | Currently sent? | If missing (SKIP/FAIL) |\n|------------|----------------|-------------------|----------------|-----------------|------------------------|\n\nInclude ALL fields the receiver reads via p.get() or p[\"...\"] anywhere in the file.\n\nThen for each field marked \"not currently sent\" or \"unreliably sent\":\n\n**bars_since_breakout**\n- EscalationTracker._tracked stores {\"signal\": sig, \"level\": 0}\n- Does it count how many check() calls have fired since registration?\n- If not: add a \"bars_since\" counter that increments each check() cycle\n- Where to set it on the signal before calling alert_system.send_alert()\n\n**breakout_level** and **distance_from_breakout_pct**\n- breakout_level = the price level the breakout crossed (resistance/support)\n- Where does the scanner identify this level? In detect_breakout()? _compressing()?\n- How to store it on BreakoutSignal (add a field to the dataclass)\n- distance_from_breakout_pct = (current_price - breakout_level) / breakout_level * 100\n\n**structural_stop_price**\n- Is this in _build_enrichment()? If so, what formula?\n- If not: propose formula (e.g., recent swing low for longs, recent swing high for shorts)\n\n**candle OHLC** (open/high/low/close)\n- The receiver's _check_no_wick_rejection() needs all four\n- Is PriceData (which has open_price, high, low, price) available in _build_enrichment?\n- Map PriceData → enrichment[\"open\"], [\"high\"], [\"low\"], [\"close\"]\n\n**rsi, sma200, market_pct_change**\n- Are these computed in _build_enrichment? If partially: what's missing?\n\nOutput the table plus a per-field fix specification."},{id: analyze-direction-flip,depends_on: [scan-timing-constants],context: fresh,allowed_tools: [Read,Grep],prompt: "You are designing the direction-flip logic for the breakout receiver.\n\n## Receiver constants\n$scan-timing-constants.output\n\nRead core/breakout_receiver.py fully, especially:\n- _check_price_still_moving(): current rejection logic\n- receive_signal(): the outer flow\n- PRICE_DRIFT_MAX_PCT constant\n\nAlso read BreakoutScanner.py: resolved_direction(), signal_direction(), momentum_score usage.\n\nDesign a _try_direction_flip() method for BreakoutReceiver:\n\n**Trigger condition**: A LONG signal arrives. _check_price_still_moving() detects that\ncurrent live price has drifted more than -PRICE_DRIFT_MAX_PCT from the signal's current_price.\nInstead of immediately rejecting, attempt a direction flip to SHORT.\n\n**Flip criteria** (require 2 of 3):\n1. volume_spike in payload >= VOLUME_SPIKE_MIN (volume still elevated → real move)\n2. momentum_score in payload < 0 (momentum has reversed)\n3. Live price is below the candle_open (if OHLC available → bearish candle forming)\n\n**If flip criteria met**:\n- Clone the payload dict\n- Set direction = \"short\"\n- Update current_price to the live price fetched in _check_price_still_moving\n- Recalculate move_pct as negative (short move)\n- Keep bars_since_breakout and distance_from_breakout_pct but negate distance\n- Re-run the full _run_checklist() on the mutated payload\n- Log: \"[BREAKOUT RECV] DIRECTION FLIP {sym}: LONG→SHORT (drift={pct:.2f}%, criteria_met={N}/3)\"\n\n**If flip criteria not met**:\n- Return None → caller rejects as before\n\nWrite the complete Python implementation of _try_direction_flip() and show exactly\nwhere to call it inside _check_price_still_moving() or receive_signal().\n\nAlso address: should the flip check also work SHORT→LONG (reversed short)? Design that too."},{id: analyze-reentry,depends_on: [scan-position-monitor],context: fresh,allowed_tools: [Read,Grep,Bash],prompt: "You are designing the re-entry loop for profitable breakout trades.\n\n## Position monitor / wiring context\n$scan-position-monitor.output\n\nRead these files now:\n- core/breakout_receiver.py: _check_not_in_cooldown(), _inject_signal()\n- core/risk_manager.py: _last_closed structure, how wins are recorded\n- core/position_monitor.py: find where trades are marked closed with profit\n- BreakoutScanner.py: EscalationTracker.check(), AlertSystem.send_alert(),\n  MarketScanner._process_symbol(), ALERT_COOLDOWN_SECS\n\n**Current state**: After a winning breakout trade closes:\n- risk_manager._last_closed[symbol] = {\"time\": now, \"won\": True}\n- receiver._check_not_in_cooldown() allows re-entry after 120s for wins\n- BUT: nothing re-triggers scanner → sender → receiver\n\n**Design the re-entry system**:\n\n**Component A: Trade close callback**\nWhere in position_monitor.py or risk_manager.py does a trade mark itself as closed+won?\nAdd a callback hook:\n  def on_breakout_trade_closed(symbol: str, won: bool, exit_price: float, direction: str):\n      if won and re_entry_callback:\n          re_entry_callback(symbol, exit_price, direction)\n\n**Component B: MarketScanner.re_entry_scan(symbol)**\nA new method on MarketScanner:\n1. Immediately fetch current PriceData for symbol (don't wait for next scan cycle)\n2. Check if symbol is in EscalationTracker._tracked — get current level\n3. If still tracked: call self.alert_system.send_alert(sig, escalation=current_level)\n   with a flag to BYPASS ALERT_COOLDOWN_SECS (since we want immediate re-entry)\n4. If not tracked but price still moving: call _process_symbol() → re-adds to watchlist\n5. Thread safety: this runs from the trade-close event, not the scan loop thread\n   Use threading.Lock or schedule via the scan loop's queue\n\n**Component C: Wiring in bot_engine.py**\nHow to connect without circular imports:\n- bot_engine imports both scanner and receiver\n- Set scanner reference on receiver at startup (already done via set_scanner())\n- Add: scanner.set_reentry_callback(on_win_callback) where callback reaches back\n- Or: use a threading.Event / queue to post re_entry_scan tasks to the scan loop\n\nWrite interface signatures and pseudocode for A, B, and C.\nFlag any thread safety risks (scan loop thread vs trade close thread)."},{id: synthesize-plan,depends_on: [analyze-timing,analyze-enrichment,analyze-direction-flip,analyze-reentry],model: sonnet,context: fresh,prompt: "You are writing the final implementation plan document for the breakout signal pipeline.\nWrite it directly to disk using the Write tool.\n\n## Timing Analysis\n$analyze-timing.output\n\n## Enrichment Field Mapping\n$analyze-enrichment.output\n\n## Direction Flip Design\n$analyze-direction-flip.output\n\n## Re-Entry Design\n$analyze-reentry.output\n\nWrite the complete plan to: $ARTIFACTS_DIR/breakout_pipeline_plan.md\n\nUse the Write tool with this exact document structure:\n\n---\n# Breakout Signal Pipeline — Implementation Plan\n\n> Auto-generated analysis of BreakoutScanner.py → breakout_sender.py → core/breakout_receiver.py\n\n## Executive Summary\n\n(3-4 sentences: current state, four problems, expected outcome after fixes)\n\n---\n\n## Part 1 — Sub-Minute Signal Delivery\n\n### Root Cause\n(Exact timing breakdown — what causes signals to arrive late at the receiver)\n\n### Required Changes\n\n| File | Class / Method | Change | Why |\n|------|---------------|--------|-----|\n\n### Code Sketch\n```python\n# Concrete code changes — not pseudocode\n```\n\n### Acceptance Criteria\n- [ ] Signal timestamp set at detection moment (not send moment)\n- [ ] Worst-case delivery from detection to receiver < 60s\n- [ ] Escalation re-sends (esc=1/2/3) bypass dedup correctly\n- [ ] receiver._check_freshness() passes on first-cycle signals\n\n---\n\n## Part 2 — Complete Enrichment Payload\n\n### Missing Fields\n\n| Field | Receiver check (hard/soft/req) | Currently sent? | Fix location | Formula |\n|-------|-------------------------------|-----------------|--------------|---------|\n\n### Required Changes\n\n| File | Class / Method | Change | Why |\n|------|---------------|--------|-----|\n\n### Code Sketch\n```python\n# Concrete additions to _build_enrichment() and BreakoutSignal dataclass\n```\n\n### Acceptance Criteria\n- [ ] BreakoutSignal dataclass has: bars_since_breakout, breakout_level, distance_from_breakout_pct\n- [ ] _build_enrichment() populates: open/high/low/close, rsi, sma200, structural_stop_price, market_pct_change\n- [ ] EscalationTracker.check() updates bars_since_breakout on each cycle\n- [ ] receiver _check_no_wick_rejection() → PASS (not SKIP) on all scanner signals\n- [ ] receiver _check_momentum_phase() → PASS (not SKIP) on all scanner signals\n\n---\n\n## Part 3 — Direction Flip Logic (Long → Short)\n\n### Design\n(When flip is attempted, what criteria must pass)\n\n### Required Changes\n\n| File | Class / Method | Change | Why |\n|------|---------------|--------|-----|\n\n### _try_direction_flip() Implementation\n```python\n# Complete Python implementation\ndef _try_direction_flip(self, p: Dict, drift_pct: float) -> Optional[Dict]:\n    ...\n```\n\n### Acceptance Criteria\n- [ ] Long signal with >0.5% adverse drift triggers flip attempt\n- [ ] Flip requires 2/3 criteria: volume elevated, momentum negative, bearish candle\n- [ ] Flipped payload re-runs full checklist before injection\n- [ ] SHORT→LONG flip also handled\n- [ ] Flip events logged with symbol, direction change, drift%, criteria count\n\n---\n\n## Part 4 — Re-Entry After Profitable Close\n\n### Design\n(How the trade-close event reaches the scanner without circular imports)\n\n### Required Changes\n\n| File | Class / Method | Change | Why |\n|------|---------------|--------|-----|\n\n### Implementation\n```python\n# Component A: trade close hook\n# Component B: MarketScanner.re_entry_scan()\n# Component C: bot_engine.py wiring\n```\n\n### Acceptance Criteria\n- [ ] Winning breakout trade close fires re_entry_scan() within 1s\n- [ ] re_entry_scan() bypasses ALERT_COOLDOWN_SECS when called from win callback\n- [ ] If breakout still ongoing: new signal delivered to receiver within 60s of win\n- [ ] Thread safety: re_entry_scan() is safe to call from trade-close thread\n- [ ] No circular imports introduced\n\n---\n\n## Implementation Order\n\n(Which part to do first, what depends on what)\n\n1. **Part 2 first** — enrichment fixes are prerequisite for Parts 3 & 4 to work correctly\n2. **Part 1 second** — timing fixes ensure the enriched signals arrive on time\n3. **Part 3 third** — direction flip needs correct enrichment (OHLC, momentum_score)\n4. **Part 4 last** — re-entry builds on all above working correctly\n\n---\n\n## Risk Notes\n\n(Thread safety issues, cooldown interactions, edge cases, what to test carefully)\n\n---\n\nBe specific: cite actual method names, actual field names, real line number ranges where helpful.\nUse concrete Python code, not pseudocode, in the Code Sketch sections.\nAfter writing the file, print a one-line summary: \"Plan written — N lines, 4 parts complete.\""}]}