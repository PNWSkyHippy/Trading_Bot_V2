{name: archon-plan-to-pr,description: "Use when: You have an existing implementation plan and want to execute it end-to-end.\nInput: Path to a plan file ($ARTIFACTS_DIR/plan.md or .agents/plans/*.md)\nOutput: PR ready for merge with comprehensive review completed\n\nFull workflow:\n1. Read plan, setup branch, extract scope limits\n2. Verify plan research is still valid\n3. Implement all tasks with type-checking\n4. Run full validation suite\n5. Create PR with template, mark ready\n6. Comprehensive code review (5 parallel agents with scope limit awareness)\n7. Synthesize and fix review findings\n8. Final summary with decision matrix -> GitHub comment + follow-up recommendations\n\nNOT for: Creating plans from scratch (use archon-idea-to-pr), quick fixes, standalone reviews.\n",provider: codex,model: gpt-5.3-codex,nodes: [{id: plan-setup,context: fresh,command: archon-plan-setup},{id: confirm-plan,depends_on: [plan-setup],context: fresh,command: archon-confirm-plan},{id: implement-tasks,depends_on: [confirm-plan],model: "opus[1m]",provider: claude,context: fresh,command: archon-implement-tasks},{id: validate,depends_on: [implement-tasks],context: fresh,command: archon-validate},{id: finalize-pr,depends_on: [validate],context: fresh,command: archon-finalize-pr},{id: verify-pr-base,depends_on: [finalize-pr],bash: "set -euo pipefail\nEXPECTED=\"$BASE_BRANCH\"\nACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')\nif [ \"$ACTUAL\" != \"$EXPECTED\" ]; then\n  PR_NUMBER=$(gh pr view --json number -q '.number')\n  echo \"Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting\" >&2\n  gh pr edit \"$PR_NUMBER\" --base \"$EXPECTED\"\nelse\n  echo \"PR base verified: $EXPECTED\"\nfi"},{id: review-scope,depends_on: [verify-pr-base],context: fresh,command: archon-pr-review-scope},{id: sync,depends_on: [review-scope],context: fresh,command: archon-sync-pr-with-main},{id: code-review,depends_on: [sync],context: fresh,command: archon-code-review-agent},{id: error-handling,depends_on: [sync],context: fresh,command: archon-error-handling-agent},{id: test-coverage,depends_on: [sync],context: fresh,command: archon-test-coverage-agent},{id: comment-quality,depends_on: [sync],context: fresh,command: archon-comment-quality-agent},{id: docs-impact,depends_on: [sync],context: fresh,command: archon-docs-impact-agent},{id: synthesize,depends_on: [code-review,error-handling,test-coverage,comment-quality,docs-impact],trigger_rule: one_success,context: fresh,command: archon-synthesize-review},{id: implement-fixes,depends_on: [synthesize],context: fresh,command: archon-implement-review-fixes},{id: workflow-summary,depends_on: [implement-fixes],context: fresh,command: archon-workflow-summary}]}